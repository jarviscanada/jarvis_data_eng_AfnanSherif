# List of Jarvis projects
jarvis_projects:
  - name: "Linux Cluster Monitoring Agent"
    git_url: "https://github.com/jarviscanada/jarvis_data_eng_AfnanSherif/tree/feature/profile/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "This project implements an automated Linux monitoring solution using Bash scripting to collect host-level metrics such as CPU utilization and memory usage. A lightweight monitoring agent runs on each host at regular one-minute intervals to capture real-time performance data and store it in a centralized PostgreSQL database, along with logs for troubleshooting and tracking. The project uses Bash for automation, PostgreSQL for storage, Docker for containerization, and Crontab for scheduling."

# List of personal or academic projects
# Feel free to add more projects
highlighted_projects:
    #project name
  - name: "Detecting Malware Email Using Machine Learning"
    #URL is optional
    git_url: "https://github.com/jarviscanada/jarvis_profile_builder"
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "The project focused on developing an intelligent email threat detection system designed to identify phishing and malicious emails. It involved collecting and preparing datasets, training and evaluating machine learning models using metrics such as accuracy, precision, recall, and F1-score, and continuously improving the models to reduce false positives. I also developed a Python-based web application, REST API, and browser extension to enable real-time email scanning and threat detection directly within the user interface. The project used technologies and libraries such as Python, Flask, scikit-learn, pandas, joblib, HTML, CSS, and JavaScript. This project was especially meaningful because it combined my interests in cybersecurity, software development, and artificial intelligence to solve a real-world problem."

