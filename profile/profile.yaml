  - name: "Detecting Malware Email Using Machine Learning"
    #URL is optional
    git_url: "https://github.com/jarviscanada/jarvis_profile_builder"
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "The project focused on developing an intelligent email threat detection system designed to identify phishing and malicious emails by integrating scikit-learn machine learning models. It involved collecting and preparing datasets, training and evaluating machine learning models using metrics such as accuracy, precision, recall, and F1-score, and continuously improving the models to reduce false positives. I also developed a Python-based web application, REST API, and browser extension to enable real-time email scanning and threat detection directly within the user interface. This project was especially meaningful because it combined my interests in cybersecurity, software development, and artificial intelligence to solve a real-world problem."

