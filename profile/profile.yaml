# List of Jarvis projects
jarvis_projects:
  - name: "Linux Cluster Monitoring Agent"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: " This project implements an automated Linux monitoring system using Bash scripting to collect and store host-level metrics such as CPU utilization and memory usage. A lightweight monitoring agent runs on each host and executes system commands at regular intervals (every minute) to capture real-time performance data. The collected information is then stored in a centralized PostgreSQL database named host_agent, along with log files for tracking and troubleshooting. The system is built using a combination of technologies including Bash for scripting, PostgreSQL for data storage, Docker for containerization, and Crontab for scheduling. Additional tools such as Git, GitHub, and Gitflow are used for version control, while SSH and CLI utilities were used for remote access and system interaction."

# List of personal or academic projects
# Feel free to add more projects
#highlighted_projects:
    #project name
  - name: "Detecting Malware Email Using Machine Learning"
    #URL is optional
    #git_url: "https://github.com/jarviscanada/jarvis_profile_builder"
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "The project focused on developing an intelligent email threat detection system designed to identify phishing and malicious emails. The project involved collecting and preparing datasets, training and evaluating models using metrics such as accuracy, precision, recall, and F1-score, and improving the system to reduce false positives. The next phase of the project is about integrating the solution into a practical interface through a browser extension and API, allowing real-time scanning of emails. This project was especially meaningful because it combined my interests in cybersecurity, software development, and artificial intelligence to solve a real-world problem."

