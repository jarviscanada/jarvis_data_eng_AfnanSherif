# List of Jarvis projects
jarvis_projects:
  - name: "Linux Cluster Monitoring Agent"
    git_url: "https://github.com/jarviscanada/jarvis_data_eng_AfnanSherif/tree/develop/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "This project implements an automated Linux monitoring solution using Bash scripting to collect host-level metrics such as CPU utilization and memory usage. A lightweight monitoring agent runs using Crontab on each host at regular intervals to capture real-time performance data and store it in a centralized PostgreSQL database running inside a Docker container, along with logs for troubleshooting and tracking."

  - name: "Core Java - Grep App"
    git_url: "https://github.com/jarviscanada/jarvis_data_eng_AfnanSherif/tree/develop/core_java/grep"
    description: "This project is a Java application that mimics the Linux grep command by recursively searching files and extracting lines that match a given regular expression. Two implementations were developed: JavaGrepImp using core Java and JavaGrepLambdaImp using Java Streams and lambda expressions. The project utilizes core Java concepts such as OOP, collections, file I/O, exception handling, recursion, and regular expressions. Additional tools and technologies used include Maven for dependency management, SLF4J/Log4j for logging, IntelliJ IDEA as the IDE, Git/GitHub for source control, and Docker for application distribution."

  - name: "Python Data Analytics"
    git_url: "https://github.com/jarviscanada/jarvis_data_eng_AfnanSherif/tree/develop/python_data_analytics"
    description: "This project focused on analyzing historical retail transaction data for a UK-based e-commerce company to identify customer behavior patterns and support business growth decisions. The goal was to improve customer retention, revenue growth, and marketing strategy through data-driven insights.
The project was implemented in Python using a Jupyter Notebook environment. Pandas was used for data cleaning and transformation, NumPy for statistical analysis, and Matplotlib for visualization. The analysis covered sales trends, customer activity, revenue patterns, and customer segmentation to identify high-value customers and purchasing behavior insights."

